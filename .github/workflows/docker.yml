name: Docker Deploy

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: us-east1
  ARTIFACT_REPOSITORY: gap-dev-images
  IMAGE_NAME: gcp-ai-app
  CLOUD_RUN_SERVICE: gcp-ai-dev

jobs:
  build-and-deploy:
    name: Build and deploy application
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_SERVICE_ACCOUNT }}

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build Docker image
        run: |
          docker build \
            --tag "${GCP_REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            ./app

      - name: Push Docker image
        run: |
          docker push \
            "${GCP_REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image "${GCP_REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            --region "${GCP_REGION}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --quiet
